<!DOCTYPE html>
<html lang="en">

<head>
    <title>Syncfusion TypeScript Spreadsheet</title>
    <meta charset="utf-8" />

    <meta name="description" content="Syncfusion TypeScript Spreadsheet" />

<body>
    <!-- Element which will render as Spreadsheet -->
    <div>
        <div>
            <select id="changeDataDropdown" class="btn">

        </div>
    </div>
